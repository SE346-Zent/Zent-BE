[package]
name = "mongodb_migration"
version = "0.1.0"
edition = "2021"

[dependencies]
mongodb = "3.1.1"
mongodb-migrator = "0.1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
